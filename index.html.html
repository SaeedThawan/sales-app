    function App() {

      // المودالات
      const [editingRep, setEditingRep] = useState(null);
      const [isManagingGroups, setIsManagingGroups] = useState(false);
      const [isManagingUsers, setIsManagingUsers] = useState(false);
      
      // نموذج إضافة مجموعة جديدة

      // محاكي "ماذا لو؟"
      const [simulatedRepId, setSimulatedRepId] = useState(14);

      const showToast = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(''), 4000);
      };

      const formatNum = (num) => {
        if (num === null || num === undefined || isNaN(num)) return '0';
        return Math.round(num).toLocaleString('en-US');
      };

      useEffect(() => {
        let unsubscribe = null;
        async function initCloudSync() {
          try {
            if (!window.__FIREBASE_MODULES__) {
              setIsCloudSynced(true);
              return;
            }
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, setDoc, onSnapshot } = window.__FIREBASE_MODULES__;
            
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'sales-erp-hierarchy-v2';
            let firebaseConfig = null;
            if (typeof __firebase_config !== 'undefined') {
              try { firebaseConfig = JSON.parse(__firebase_config); } catch(e){}
            }

            if (!firebaseConfig) {
              setIsCloudSynced(true);
              return;
            }

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            const mainDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'sales_platform_master');

            unsubscribe = onSnapshot(mainDocRef, (snap) => {
              if (snap.exists()) {
                const data = snap.data();
                if (data.periods) setPeriodsData(data.periods);
                if (data.users) setUsersList(data.users);
                if (data.branches) setBranchesList(data.branches);
              } else {
                setDoc(mainDocRef, {
                  periods: { august: AUGUST_DEFAULT, september: SEPTEMBER_DEFAULT },
                  users: DEFAULT_USERS,
                  branches: DEFAULT_BRANCHES,
                  updatedAt: new Date().toISOString()
                }).catch(e => console.log(e));
              }
              setIsCloudSynced(true);
            }, (err) => {
              console.warn(err.message);
              setIsCloudSynced(true);
            });
          } catch(err) {
            console.warn(err);
            setIsCloudSynced(true);
          }
        }

        if (window.__FIREBASE_MODULES__) initCloudSync();
        else window.addEventListener('firebase-sdk-ready', initCloudSync, { once: true });

        return () => { if (unsubscribe) unsubscribe(); };
      }, []);

      // دالة الحفظ السحابي المركزي
      const persistMasterStateToCloud = async (newPeriods, newUsers, newBranches) => {
        setIsSavingCloud(true);
        if (newPeriods) setPeriodsData(newPeriods);
        if (newUsers) setUsersList(newUsers);
        if (newBranches) setBranchesList(newBranches);

        try {
          if (window.__FIREBASE_MODULES__) {
            const { initializeApp, getFirestore, doc, setDoc } = window.__FIREBASE_MODULES__;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'sales-erp-hierarchy-v2';
            let firebaseConfig = null;
            if (typeof __firebase_config !== 'undefined') {
              try { firebaseConfig = JSON.parse(__firebase_config); } catch(e){}
            }
            if (firebaseConfig) {
              const app = initializeApp(firebaseConfig);
              const db = getFirestore(app);
              const mainDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'sales_platform_master');
              await setDoc(mainDocRef, {
                periods: newPeriods || periodsData,
                users: newUsers || usersList,
                branches: newBranches || branchesList,
                lastSavedBy: currentUser?.name || 'مستخدم النظام',
                updatedAt: new Date().toISOString()
              }, { merge: true });
            }
          }
        } catch (e) {
          console.log('Saved to local state (Cloud notice):', e);
        } finally {
          setIsSavingCloud(false);
        }
      };

      const activeConfig = periodsData[currentPeriod] || SEPTEMBER_DEFAULT;

      // حسابات أداء المندوبين
      const processedReps = useMemo(() => {
        const rules = activeConfig;
        const currentGroupsCount = rules.groupRules.length;

        return (rules.repsData || []).map(rep => {
          const genTarget = rep.generalTarget || 0;
          const genSales = rep.generalSales || 0;
          const genPct = genTarget > 0 ? (genSales / genTarget) * 100 : 0;
          const meetsGeneralRule = genPct >= rules.generalThresholdPct;

          const requiredGenSales = genTarget * (rules.generalThresholdPct / 100);
          const remainingGenSales = Math.max(0, requiredGenSales - genSales);

          let qualifiedGroupsCount = 0;
          let potentialGroupCommSum = 0;

          // مطابقة مصفوفة المجموعات بدقة مع قواعد المجموعات الديناميكية الحالية
          const detailedGroups = rules.groupRules.map((rule, gIdx) => {
            const grp = (rep.groups && rep.groups[gIdx]) ? rep.groups[gIdx] : { target: 0, sales: 0 };
            const grpTarget = grp.target || 0;
            const grpSales = grp.sales || 0;
            const grpPct = grpTarget > 0 ? (grpSales / grpTarget) * 100 : 0;
            const isQualified = grpTarget > 0 && grpPct >= rule.thresholdPct;

            if (isQualified) qualifiedGroupsCount++;

            const potentialComm = isQualified ? (rule.commValue || 0) : 0;
            potentialGroupCommSum += potentialComm;

            const thresholdTargetSales = grpTarget * (rule.thresholdPct / 100);
            const remainingToThreshold = Math.max(0, thresholdTargetSales - grpSales);

            return {
              ...grp,
              ruleId: rule.id,
              originalIndex: gIdx,
              name: rule.name,
              code: rule.code,
              thresholdPct: rule.thresholdPct,
              commValue: rule.commValue,
              grpPct,
              isQualified,
              thresholdTargetSales,
              remainingToThreshold,
              potentialComm
            };
          });

          // شروط الصرف المالي الصارمة:
          const meetsMinGroupsRule = qualifiedGroupsCount >= rules.minGroupsRequired;
          const isFullyEligible = meetsGeneralRule && meetsMinGroupsRule;

          const totalGroupCommissionEarned = isFullyEligible ? potentialGroupCommSum : 0;
          const baseGenComm = Number(rules.generalTargetCommValue) || 0;
          const generalTargetCommEarned = (isFullyEligible && baseGenComm > 0) ? baseGenComm : 0;
          const grandTotalCommission = totalGroupCommissionEarned + generalTargetCommEarned;

          // تحديد الفرع واسم المشرف التابع له
          const branchObj = branchesList.find(b => b.id === rep.branchId) || { name: 'الفرع الرئيسي' };
          const supervisorUser = usersList.find(u => u.role === 'supervisor' && u.supervisedRepIds && u.supervisedRepIds.includes(rep.id));

          let blockReason = 'مؤهل للصرف بالكامل ✅';
          if (!meetsGeneralRule && !meetsMinGroupsRule) {
            blockReason = `محجوبة: الهدف العام (${genPct.toFixed(0)}%) وحقق ${qualifiedGroupsCount}/${rules.minGroupsRequired} مجموعات`;
          } else if (!meetsGeneralRule) {
            blockReason = `محجوبة: نسبة الهدف العام (${genPct.toFixed(0)}% < ${rules.generalThresholdPct}%)`;
          } else if (!meetsMinGroupsRule) {
            blockReason = `محجوبة: حقق ${qualifiedGroupsCount} من أصل ${rules.minGroupsRequired} مجموعات مطلوبة`;
          }

          return {
            ...rep,
            branchName: branchObj.name,
            supervisorName: supervisorUser ? supervisorUser.name : 'مشرف الفرع العام',
            genPct,
            requiredGenSales,
            remainingGenSales,
            meetsGeneralRule,
            meetsMinGroupsRule,
            isFullyEligible,
            blockReason,
            detailedGroups,
            qualifiedGroupsCount,
            totalGroupCommissionEarned,
            generalTargetCommEarned,
            potentialGroupCommSum,
            grandTotalCommission
          };
        });
      }, [activeConfig, branchesList, usersList]);

      const authorizedReps = useMemo(() => {
        if (!currentUser) return [];
        if (currentUser.role === 'admin' || currentUser.role === 'finance') {
          // المدير والمحاسب يشاهد الجميع
          if (branchFilter === 'all') return processedReps;
          return processedReps.filter(r => r.branchId === branchFilter);
        }
        if (currentUser.role === 'supervisor') {
          // المشرف يشاهد فقط المندوبين الموكلين إليه
          const supervised = currentUser.supervisedRepIds || [];
          return processedReps.filter(r => supervised.includes(r.id));
        }
        if (currentUser.role === 'rep') {
          return processedReps.filter(r => r.id === currentUser.repId);
        }
        return processedReps;
      }, [currentUser, processedReps, branchFilter]);

      // إحصائيات KPI المعتمدة على الصلاحية الحالية
      const kpiTotals = useMemo(() => {
        let totalTarget = 0, totalSales = 0, totalCommissionPaid = 0, totalPotentialBlocked = 0;
        let eligibleCount = 0;

        authorizedReps.forEach(r => {
          totalTarget += r.generalTarget;
          totalSales += r.generalSales;
          totalCommissionPaid += r.grandTotalCommission;
          totalPotentialBlocked += (r.potentialGroupCommSum + (Number(activeConfig.generalTargetCommValue) || 0)) - r.grandTotalCommission;
          if (r.isFullyEligible) eligibleCount++;
        });

        const overallRate = totalTarget > 0 ? (totalSales / totalTarget) * 100 : 0;
        return {
          totalTarget,
          totalSales,
          overallRate,
          totalCommissionPaid,
          totalPotentialBlocked,
          eligibleCount,
          totalReps: authorizedReps.length
        };
      }, [authorizedReps, activeConfig]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setAuthError('');

        const cleanUsername = loginUsername.trim().toLowerCase();
        const foundUser = usersList.find(u => u.username.toLowerCase() === cleanUsername && u.password === loginPassword.trim());

        if (foundUser) {
          setCurrentUser(foundUser);
          if (foundUser.role === 'rep') {
            setActiveTab('portal');
            showToast(`أهلاً بك يا ${foundUser.name}! تم تسجيل دخولك لبوابتك الشخصية بنجاح.`);
          } else {
            setActiveTab('matrix');
            showToast(`مرحباً ${foundUser.name}، تم تسجيل الدخول بنجاح بصلاحية: ${foundUser.role === 'admin' ? 'المدير العام' : (foundUser.role === 'supervisor' ? 'مشرف المبيعات' : 'المحاسب المالي')}`);
          }
        } else {
          setAuthError('اسم المستخدم أو كلمة المرور غير صحيحة! يرجى التأكد وإعادة المحاولة.');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setLoginUsername('');
        setLoginPassword('');
        setAuthError('');
        showToast('تم تسجيل الخروج بنجاح.');
      };

      const handleAddNewGroup = (e) => {
        e.preventDefault();
        if (!newGroupForm.name) {
          showToast('يرجى كتابة اسم الصنف أو المجموعة!');
          return;
        }

        const newRule = {
          id: 'grp_' + Date.now(),
          name: newGroupForm.name.trim(),
          code: newGroupForm.code.trim() || 'NEW',
          commValue: parseFloat(newGroupForm.commValue) || 200,
          thresholdPct: parseFloat(newGroupForm.thresholdPct) || 70,
          commType: 'fixed'
        };

        const updatedPeriods = { ...periodsData };
        const currentPeriodObj = { ...updatedPeriods[currentPeriod] };
        currentPeriodObj.groupRules = [...currentPeriodObj.groupRules, newRule];

        // إضافة خانة الهدف لهذا الصنف لكل المندوبين بقيمة 0 افتراضياً
        currentPeriodObj.repsData = currentPeriodObj.repsData.map(rep => ({
          ...rep,
          groups: [...(rep.groups || []), { target: 0, sales: 0 }]
        }));

        updatedPeriods[currentPeriod] = currentPeriodObj;
        persistMasterStateToCloud(updatedPeriods, null, null);
        setNewGroupForm({ name: '', code: '', commValue: 200, thresholdPct: 70 });
        showToast(`تمت إضافة مجموعة [${newRule.name}] سحابياً إلى كل المندوبين بنجاح!`);
      };

      const handleDeleteGroup = (ruleIndex, ruleName) => {
        if (currentUser?.role !== 'admin') {
          showToast('حذف الأصناف مقصور على المدير العام فقط!');
          return;
        }

        const updatedPeriods = { ...periodsData };

              target: newGroupTargets[idx] !== undefined ? Math.max(0, parseFloat(newGroupTargets[idx]) || 0) : grp.target

            return {
              ...rep,
              generalTarget: newGenTarget !== undefined ? Math.max(0, parseFloat(newGenTarget) || 0) : rep.generalTarget,
              groups: updatedGroups

          return rep;

          const simPct = grp.target > 0 ? (simSales / grp.target) * 100 : 0;
